# Docker Compose for deploying the screenshot service

services:
  excel-screenshot:
    build:
      context: ./screenshot-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # No ports exposed by default (internal communication only)